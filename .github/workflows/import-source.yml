name: Import Aster CAS source

on:
  push:
    branches: [main]
    paths: ['.bootstrap/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-aster-source
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'wieslawsoltes/AsterCAS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and unpack original source
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.bootstrap/manifest.json').read_text())
          data = b''.join((root / '.bootstrap' / name).read_bytes() for name in manifest['parts'])
          assert hashlib.sha256(data).hexdigest() == manifest['sha256'], 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() and '.git' not in path.parts and '.github' not in path.parts
              archive.extractall(root, members=members, filter='data')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate symbolic kernel
        run: npm test
      - name: Build standalone application
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run browser integration checks and regenerate screenshots
        run: python tests/browser_integration.py
      - name: Validate both builds on a real localhost origin
        run: python tests/browser_live.py
      - name: Commit complete application, tests, documentation and screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore LICENSE README.md build.mjs docs index.html js package.json styles.css tests dist .nojekyll
          git rm -r .bootstrap
          git commit -m 'feat: import Aster CAS engine, worksheet editor, WebGPU renderer, tests and documentation'
          git push origin HEAD:main
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-import-validation
          path: |
            docs/browser-test-results.json
            test-results/
            dist/index.html
